name: DevSecOps - Security Scans

on:
  push:
    branches:
      - main
      - develop
      - 'dev-*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    # Scan hebdomadaire tous les lundis à 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Leaked Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Verify No Sensitive Files Committed
        run: |
          echo "Vérification de l'absence de fichiers sensibles (.env, clés privées, certificats)..."
          SENSITIVE_FILES=$(git ls-files | grep -E '(\.env$|\.key$|\.pem$|\.cert$|id_rsa$)' || true)
          if [ -n "$SENSITIVE_FILES" ]; then
            echo "::error::Fichiers sensibles détectés dans Git : $SENSITIVE_FILES"
            exit 1
          fi
          echo "Aucun fichier sensible détecté dans l'arborescence suivie par Git."

  trivy-fs:
    name: Trivy - Scan du code et des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-fs-report.txt
          # Mettre '1' pour faire échouer la CI en cas de faille HIGH/CRITICAL
          exit-code: '0'

      - name: Afficher le rapport
        if: always()
        run: cat trivy-fs-report.txt

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt

  trivy-images:
    name: Trivy - Scan image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build de l'image ${{ matrix.service }}
        run: docker build --build-arg VITE_API_BASE_URL=http://localhost:8080/api/v1 -t pfe-${{ matrix.service }}:scan ./${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pfe-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-${{ matrix.service }}-report.txt
          # Mettre '1' pour faire échouer la CI en cas de faille HIGH/CRITICAL
          exit-code: '0'

      - name: Afficher le rapport
        if: always()
        run: cat trivy-${{ matrix.service }}-report.txt

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-report
          path: trivy-${{ matrix.service }}-report.txt