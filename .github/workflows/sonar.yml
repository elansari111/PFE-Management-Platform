name: DevSecOps - SonarQube

on:
  push:
    branches:
      - main
      - 'dev-*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube - Analyse et Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Démarrer SonarQube
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:10.7.0-community

      - name: Attendre que SonarQube soit prêt
        run: |
          for i in $(seq 1 60); do
            if curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "SonarQube prêt"
              exit 0
            fi
            echo "Attente de SonarQube ($i/60)..."
            sleep 5
          done
          echo "::error::SonarQube n'a pas démarré"
          docker logs sonarqube --tail 50
          exit 1

      - name: Générer un token
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=ci" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Analyse du backend (échec si Quality Gate KO)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests compile \
            org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.projectKey=pfe-backend \
            -Dsonar.projectName=pfe-backend \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=true

      - name: Analyse du frontend (échec si Quality Gate KO)
        run: |
          docker run --rm --network host \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -e SONAR_TOKEN=$SONAR_TOKEN \
            -v "${{ github.workspace }}/frontend:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.qualitygate.wait=true

      - name: Logs SonarQube en cas d'échec
        if: failure()
        run: docker logs sonarqube --tail 60