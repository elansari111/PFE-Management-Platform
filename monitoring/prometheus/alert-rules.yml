groups:
  - name: pfe-alerts
    rules:
      - alert: BackendDown
        expr: up{job="pfe-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Le backend PFE est indisponible"

      - alert: HighCpuUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation CPU supérieure à 80 %"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Utilisation mémoire supérieure à 85 %"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Espace disque inférieur à 15 %"

      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{application="pfe-backend",status=~"5.."}[2m])) / sum(rate(http_server_requests_seconds_count{application="pfe-backend"}[2m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreurs 5xx supérieur à 5 %"